;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;; DEFAULT
[env:main]
platform = atmelavr
board = megaatmega2560
framework = arduino

build_flags = 
    -std=c++17
    -I"lib"

    -Wall

lib_deps = 
    ;System
    Wire
    ;BNO055
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    ;Servo
    Servo

monitor_speed = 115200

build_src_filter = +<*> -<*.cpp> -<debug/> +<main.cpp>



